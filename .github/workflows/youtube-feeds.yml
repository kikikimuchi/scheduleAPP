name: YouTube feeds refresh

# 「取りに行く係」: 定期的に全チャンネルのRSSを取得して
# youtube-reader/web/data/videos.json を更新・コミットする。
# ブラウザはCORSで直接取れないため、ここ(サーバー側)で取得する。

on:
  schedule:
    - cron: '0 */6 * * *'   # 6時間ごと（UTC基準）
  workflow_dispatch: {}      # 手動実行も可

# 同時実行の重複を防ぐ
concurrency:
  group: youtube-feeds
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch RSS and rebuild videos.json
        run: node youtube-reader/gha-fetch.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- youtube-reader/web/data/videos.json; then
            echo "変更なし。コミットしません。"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add youtube-reader/web/data/videos.json
            git commit -m "chore: refresh YouTube feeds (videos.json)"
            git push
          fi
