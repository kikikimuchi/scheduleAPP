name: YouTube feeds refresh

# 「取りに行く係」: 定期的に全チャンネルのRSSを取得して
# youtube-reader/web/data/videos.json を更新・コミットする。
# ブラウザはCORSで直接取れないため、ここ(サーバー側)で取得する。

on:
  schedule:
    - cron: '0 * * * *'      # 毎時（フィード=RSSは無料なので頻繁でOK。ライブ配信を早く拾うため）
  workflow_dispatch: {}      # 手動実行も可

# 同時実行の重複を防ぐ
concurrency:
  group: youtube-feeds
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # rebase 時に共通祖先をたどれるよう全履歴を取得

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch subscription RSS -> videos.json
        # YOUTUBE_API_KEY があればショート判定に動画の尺を使う（未設定なら #shorts タグのみ）
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node youtube-reader/gha-fetch.js

      - name: Fetch discover (YouTube search) -> discover.json
        # おすすめは検索APIのクォータ消費が大きい(1回100・1日上限100回)ので6時間ごと(UTC 0,6,12,18時)だけ実行。
        # 手動実行では走らせない（クォータ節約）。
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          H=$(date -u +%H)
          if [ $((10#$H % 6)) -eq 0 ]; then
            node youtube-reader/gha-discover.js
          else
            echo "discover はこの時間帯はスキップ（6時間ごと・手動では走りません）。"
          fi

      - name: Commit if changed
        # 毎時スケジュールと手動実行が重なるとpushが競合するので、最新mainの上にrebaseして再試行。
        # 生成物(data/*.json)だけをコミットし、他ファイル(work/index.html等)には一切触れないこと。
        run: |
          if git diff --quiet -- youtube-reader/web/data/videos.json youtube-reader/web/data/discover.json; then
            echo "変更なし。コミットしません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 生成物以外に差分があってもコミットに含めない（誤って他ファイルを巻き戻さないため）
          git add youtube-reader/web/data/videos.json youtube-reader/web/data/discover.json
          git commit -m "chore: refresh YouTube feeds (videos/discover)"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed"; exit 0; fi
            echo "push rejected — 最新mainの上にrebaseして再試行 ($i)"
            git fetch origin main
            # データファイルだけのコミットを最新mainの上に載せ直す。
            # 他ファイルは触っていないので競合しない。万一競合したら中断して失敗させる。
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "rebase 競合のため中断" >&2
              exit 1
            fi
            sleep $((i * 3))
          done
          echo "push failed after retries" >&2
          exit 1
